openapi: 3.0.3
info:
  title: RentaTica API
  version: 1.1.0
  description: API REST que autentica con SQL Server y delega la lógica a procedimientos almacenados. Fechas de reserva y disponibilidad son horas locales del negocio sin conversión de zona; formato YYYY-MM-DDTHH:mm:ss.SSS. Se admite Z por compatibilidad como representación del mismo valor SQL, no offsets.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Estado de la API y conexión SQL Server
      responses:
        '200': { description: API y base de datos disponibles }
        '503': { description: API iniciada sin conexión a base de datos }
  /api/equipos/disponibilidad:
    get:
      summary: Equipos disponibles por rango y alquiler estimado
      description: Fechas locales del negocio, sin sufijo de zona horaria. La creación vuelve a validar disponibilidad dentro de su transacción.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: fecha_inicio, required: true, schema: { type: string, example: '2026-12-01T08:00:00' } }
        - { in: query, name: fecha_fin, required: true, schema: { type: string, example: '2026-12-01T12:00:00' } }
      responses:
        '200': { description: Lista datos con equipos disponibles y monto_estimado del alquiler; monto_deposito es la tarifa de garantía de la categoría, no un cobro registrado }
        '400': { description: Rango inválido }
        '401': { description: Sesión inválida }
        '403': { description: Rol o negocio no autorizado }
  /api/auth/login:
    post:
      summary: Inicia sesión y devuelve un JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Credenciales válidas; devuelve token y usuario }
        '401': { description: Credenciales inválidas }
        '403': { description: Negocio suspendido }
  /api/equipos:
    get:
      summary: Lista equipos del negocio autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: estado
          schema:
            type: string
            enum: [Disponible, Reservado, Alquilado, Mantenimiento, Averiado, Fuera de servicio]
      responses:
        '200': { description: Equipos consultados por procedimiento almacenado }
        '401': { description: JWT ausente o inválido }
        '403': { description: Rol sin permiso }
  /api/reportes/inventario:
    get:
      summary: Resumen de inventario por categoría
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reporte obtenido por procedimiento almacenado }
  /api/clientes:
    get:
      summary: Lista clientes disponibles para crear una reserva
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de clientes }
        '401': { description: JWT ausente o inválido }
        '403': { description: Rol sin permiso }
  /api/metodos-pago:
    get:
      summary: Lista métodos de pago activos en el catálogo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Métodos de pago }
  /api/reservas/proximas:
    get:
      summary: Lista reservas próximas del negocio autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: dias
          schema: { type: integer, minimum: 0, maximum: 365, default: 30 }
      responses:
        '200': { description: Reservas próximas }
  /api/reservas:
    get:
      summary: Lista reservas del negocio con filtro opcional por estado
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: estado
          schema: { type: string, enum: [Pendiente, Confirmada, En curso, Completada, Cancelada] }
      responses:
        '200': { description: Reservas del negocio autenticado }
        '400': { description: Estado inválido }
        '401': { description: JWT ausente o inválido }
    post:
      summary: Crea una reserva transaccional con equipos disponibles
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cliente_id, equipo_ids, tipo_reserva, fecha_inicio, fecha_fin]
              properties:
                cliente_id: { type: integer, example: 19 }
                equipo_ids: { type: array, minItems: 1, maxItems: 20, items: { type: integer }, example: [21] }
                tipo_reserva: { type: string, enum: [Anticipada, Walk-in] }
                fecha_inicio: { type: string, format: date-time }
                fecha_fin: { type: string, format: date-time }
      responses:
        '201': { description: Reserva y detalles creados; devuelve total, saldo e identificadores }
        '400': { description: Datos inválidos }
        '401': { description: JWT ausente o inválido }
        '403': { description: Reserva no permitida o equipo no disponible }
        '409': { description: Conflicto por dato duplicado }
  /api/reservas/{reserva_id}:
    get:
      summary: Obtiene encabezado, detalles, pagos y depósito de una reserva del negocio
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reserva_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Detalle de reserva }
        '404': { description: Reserva no encontrada en el negocio }
  /api/reservas/{reserva_id}/pagos:
    post:
      summary: Registra un pago y devuelve la reserva actualizada
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reserva_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo_pago_id, monto]
              properties:
                metodo_pago_id: { type: integer }
                monto: { type: number, format: decimal, minimum: 0.01 }
      responses:
        '201': { description: Pago registrado y reserva actualizada }
        '400': { description: Monto o método inválido }
        '404': { description: Reserva no encontrada }
        '403': { description: El pago excede el saldo o la reserva no es cobrable }
  /api/devoluciones/{detalle_id}:
    post:
      summary: Registra devolución de un equipo y actualiza la reserva
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: detalle_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado_devolucion]
              properties:
                estado_devolucion: { type: string, enum: [Bueno, Averiado, Perdido] }
                monto_devuelto: { type: number, format: decimal, minimum: 0 }
                monto_retencion: { type: number, format: decimal, minimum: 0 }
      responses:
        '200': { description: Devolución registrada }
        '400': { description: Estado o montos inválidos }
        '404': { description: Detalle no encontrado en el negocio }
        '403': { description: Equipo ya devuelto o depósito no liquidable }
  /api/reservas/{reserva_id}/entrega:
    post:
      summary: Entrega todos los equipos de una reserva anticipada
      description: Requiere Confirmada, saldo del alquiler cero y horario SQL entre inicio inclusivo y fin exclusivo. Valida condiciones y otras entregas pendientes. El depósito es independiente.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: reserva_id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Entrega registrada con ficha actualizada }
        '400': { description: Identificador inválido }
        '401': { description: Sesión inválida }
        '403': { description: Rol o condiciones de entrega no válidos }
        '404': { description: Reserva no encontrada en el negocio }
  /api/reservas/{id}/modificacion/equipos:
    get:
      summary: Catálogo de equipos del negocio para modificar una reserva
      description: La disponibilidad del nuevo período se verifica al revisar y confirmar. Incluye equipos actualmente reservados para poder conservarlos.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Catálogo datos }
        '404': { description: Reserva no encontrada en el negocio }
  /api/reservas/{id}/modificacion/revisar:
    post:
      summary: Revisa fechas, equipos y precio sin guardar
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha_inicio, fecha_fin, equipo_ids]
              properties:
                fecha_inicio: { type: string, example: '2027-01-10T08:00:00.000', description: Hora local del negocio sin zona horaria }
                fecha_fin: { type: string, example: '2027-01-10T12:00:00.000' }
                equipo_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Resumen con total_anterior, total_nuevo, abonos, saldo, cambios; equipos; propuesta y confirmacion firmada válida por 15 minutos }
        '400': { description: Propuesta inválida }
        '403': { description: Horario, estado, equipos o total no permiten modificación }
        '404': { description: Reserva o equipo ajeno al negocio }
  /api/reservas/{id}/modificacion/confirmar:
    post:
      summary: Confirma exactamente la propuesta revisada
      description: Revalida dentro de una transacción. No usa importes ni equipos del cuerpo fuera del token firmado. Si cambian la reserva, el precio o los pagos devuelve 409 con una nueva revisión cuando es válida. Una confirmación vencida exige volver a revisar.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmacion]
              properties:
                confirmacion: { type: string }
      responses:
        '200': { description: Modificación guardada o propuesta sin cambios conservada }
        '409': { description: Requiere revisar y confirmar otra vez }
        '403': { description: Ya no se cumplen las reglas de modificación }
        '404': { description: Reserva no encontrada en el negocio }
  /api/equipos/{id}/ficha:
    get:
      summary: Ficha del equipo con historial de mantenimiento y reservas asociadas
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Objeto con equipo, mantenimientos y reservas del negocio autenticado }
        '403': { description: Requiere Operador o Administrador }
        '404': { description: Equipo ajeno o inexistente }
  /api/equipos/{id}/mantenimientos:
    post:
      summary: Inicia mantenimiento de un equipo Disponible o Averiado
      description: Usa el empleado y negocio autenticados y la fecha SQL. Rechaza mantenimiento abierto o alquiler pendiente de devolución.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, descripcion, costo]
              properties:
                tipo: { type: string, enum: [Correctivo, Preventivo] }
                descripcion: { type: string, minLength: 1, maxLength: 300 }
                costo: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
      responses:
        '201': { description: Mantenimiento registrado y equipo en Mantenimiento }
        '400': { description: Campos inválidos }
        '403': { description: Rol o condiciones no válidos }
        '404': { description: Equipo ajeno o inexistente }
  /api/mantenimientos/{id}/finalizar:
    post:
      summary: Cierra mantenimiento y registra el resultado explícito
      description: Disponible se convierte en Reservado si conserva reservas activas. No modifica pagos ni garantía. Requiere empleado activo del negocio.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [costo, estado_equipo]
              properties:
                costo: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
                estado_equipo: { type: string, enum: [Disponible, Averiado, Fuera de servicio] }
      responses:
        '200': { description: Cierre y cambio de estado guardados en una transacción }
        '400': { description: Campos inválidos }
        '403': { description: Mantenimiento cerrado, ajeno o condiciones no válidas }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
